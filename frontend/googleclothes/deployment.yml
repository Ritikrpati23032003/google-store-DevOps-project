apiVersion: apps/v1
kind: Deployment
metadata:
  name: googleclothes-deployment
  labels:
    app: googleclothes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googleclothes
  template:
    metadata:
      labels:
        app: googleclothes
    spec:
      containers:
      - name: googleclothes
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googleclothes:1dca3b6fd9bb27163fa79734a213658c1f756b3b
        ports:
        - containerPort: 80
