apiVersion: apps/v1
kind: Deployment
metadata:
  name: googleclothes-deployment
  labels:
    app: googleclothes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googleclothes
  template:
    metadata:
      labels:
        app: googleclothes
    spec:
      containers:
      - name: googleclothes
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googleclothes:628dfb4a8fe3891d1e4ac9b2b5b66458649213ac
        ports:
        - containerPort: 80
