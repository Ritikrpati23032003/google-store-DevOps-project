apiVersion: apps/v1
kind: Deployment
metadata:
  name: googleclothes-deployment
  labels:
    app: googleclothes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googleclothes
  template:
    metadata:
      labels:
        app: googleclothes
    spec:
      containers:
      - name: googleclothes
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googleclothes:babab2d182463560c6dc537194e39a2719d18884
        ports:
        - containerPort: 80
