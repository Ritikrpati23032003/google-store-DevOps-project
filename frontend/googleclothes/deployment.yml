apiVersion: apps/v1
kind: Deployment
metadata:
  name: googleclothes-deployment
  labels:
    app: googleclothes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googleclothes
  template:
    metadata:
      labels:
        app: googleclothes
    spec:
      containers:
      - name: googleclothes
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googleclothes:097e0b661ac3ef0b2754b1f71dfda681e5dc7900
        ports:
        - containerPort: 80
