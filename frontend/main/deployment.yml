apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-frontend-deployment
  labels:
    app: main-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-frontend
  template:
    metadata:
      labels:
        app: main-frontend
    spec:
      containers:
      - name: main-frontend
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-main:628dfb4a8fe3891d1e4ac9b2b5b66458649213ac
        ports:
        - containerPort: 80

