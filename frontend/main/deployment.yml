apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-frontend-deployment
  labels:
    app: main-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-frontend
  template:
    metadata:
      labels:
        app: main-frontend
    spec:
      containers:
      - name: main-frontend
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-main:1dca3b6fd9bb27163fa79734a213658c1f756b3b
        ports:
        - containerPort: 80

