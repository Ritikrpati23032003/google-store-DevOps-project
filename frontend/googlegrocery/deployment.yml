apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlegrocery-deployment
  labels:
    app: googlegrocery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlegrocery
  template:
    metadata:
      labels:
        app: googlegrocery
    spec:
      containers:
      - name: googlegrocery
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googlegrocery:628dfb4a8fe3891d1e4ac9b2b5b66458649213ac
        ports:
        - containerPort: 80
