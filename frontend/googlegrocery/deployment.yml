apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlegrocery-deployment
  labels:
    app: googlegrocery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlegrocery
  template:
    metadata:
      labels:
        app: googlegrocery
    spec:
      containers:
      - name: googlegrocery
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googlegrocery:babab2d182463560c6dc537194e39a2719d18884
        ports:
        - containerPort: 80
