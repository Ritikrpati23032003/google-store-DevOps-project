apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlegrocery-deployment
  labels:
    app: googlegrocery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlegrocery
  template:
    metadata:
      labels:
        app: googlegrocery
    spec:
      containers:
      - name: googlegrocery
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googlegrocery:3a500c0e9fa523db108d158dd5772b6144bec355
        ports:
        - containerPort: 80
