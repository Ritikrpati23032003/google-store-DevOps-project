apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlegrocery-deployment
  labels:
    app: googlegrocery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlegrocery
  template:
    metadata:
      labels:
        app: googlegrocery
    spec:
      containers:
      - name: googlegrocery
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googlegrocery:097e0b661ac3ef0b2754b1f71dfda681e5dc7900
        ports:
        - containerPort: 80
