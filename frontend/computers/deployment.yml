kind: Deployment
metadata:
  name: computers-deployment
  labels:
    app: computers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: computers
  template:
    metadata:
      labels:
        app: computers
    spec:
      containers:
      - name: computers
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-computers:3a500c0e9fa523db108d158dd5772b6144bec355
        ports:
        - containerPort: 80
