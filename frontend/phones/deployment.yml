apiVersion: apps/v1
kind: Deployment
metadata:
  name: phones-deployment
  labels:
    app: phones
spec:
  replicas: 2
  selector:
    matchLabels:
      app: phones
  template:
    metadata:
      labels:
        app: phones
    spec:
      containers:
      - name: phones
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-phones:3a500c0e9fa523db108d158dd5772b6144bec355
        ports:
        - containerPort: 80
