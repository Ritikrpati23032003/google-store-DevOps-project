  name: phones-deployment
  labels:
    app: phones
spec:
  replicas: 2
  selector:
    matchLabels:
      app: phones
  template:
    metadata:
      labels:
        app: phones
    spec:
      containers:
      - name: phones
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-phones:1dca3b6fd9bb27163fa79734a213658c1f756b3b
        ports:
        - containerPort: 80
