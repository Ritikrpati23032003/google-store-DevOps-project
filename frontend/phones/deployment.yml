apiVersion: apps/v1
kind: Deployment
metadata:
  name: phones-deployment
  labels:
    app: phones
spec:
  replicas: 2
  selector:
    matchLabels:
      app: phones
  template:
    metadata:
      labels:
        app: phones
    spec:
      containers:
      - name: phones
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-phones:097e0b661ac3ef0b2754b1f71dfda681e5dc7900
        ports:
        - containerPort: 80
