apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlepay-deployment
  labels:
    app: googlepay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlepay
  template:
    metadata:
      labels:
        app: googlepay
    spec:
      containers:
      - name: googlepay
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googlepay:097e0b661ac3ef0b2754b1f71dfda681e5dc7900
        ports:
        - containerPort: 80
