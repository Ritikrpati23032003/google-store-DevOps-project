apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlepay-deployment
  labels:
    app: googlepay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlepay
  template:
    metadata:
      labels:
        app: googlepay
    spec:
      containers:
      - name: googlepay
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googlepay:babab2d182463560c6dc537194e39a2719d18884
        ports:
        - containerPort: 80
