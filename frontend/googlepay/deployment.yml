apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlepay-deployment
  labels:
    app: googlepay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlepay
  template:
    metadata:
      labels:
        app: googlepay
    spec:
      containers:
      - name: googlepay
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googlepay:3a500c0e9fa523db108d158dd5772b6144bec355
        ports:
        - containerPort: 80
