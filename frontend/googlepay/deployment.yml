apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlepay-deployment
  labels:
    app: googlepay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlepay
  template:
    metadata:
      labels:
        app: googlepay
    spec:
      containers:
      - name: googlepay
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googlepay:1dca3b6fd9bb27163fa79734a213658c1f756b3b
        ports:
        - containerPort: 80
