  selector:
    matchLabels:
      app: earphones
  template:
    metadata:
      labels:
        app: earphones
    spec:
      containers:
      - name: earphones
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-earphones:3a500c0e9fa523db108d158dd5772b6144bec355
        ports:
        - containerPort: 80
