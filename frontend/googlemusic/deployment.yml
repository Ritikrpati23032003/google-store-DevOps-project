apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlemusic-deployment
  labels:
    app: googlemusic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlemusic
  template:
    metadata:
      labels:
        app: googlemusic
    spec:
      containers:
      - name: googlemusic
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googlemusic:1dca3b6fd9bb27163fa79734a213658c1f756b3b
        ports:
        - containerPort: 80
