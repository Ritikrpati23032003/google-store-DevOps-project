apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlemusic-deployment
  labels:
    app: googlemusic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlemusic
  template:
    metadata:
      labels:
        app: googlemusic
    spec:
      containers:
      - name: googlemusic
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googlemusic:628dfb4a8fe3891d1e4ac9b2b5b66458649213ac
        ports:
        - containerPort: 80
