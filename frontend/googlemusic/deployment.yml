apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlemusic-deployment
  labels:
    app: googlemusic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlemusic
  template:
    metadata:
      labels:
        app: googlemusic
    spec:
      containers:
      - name: googlemusic
        image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googlemusic:3a500c0e9fa523db108d158dd5772b6144bec355
        ports:
        - containerPort: 80
