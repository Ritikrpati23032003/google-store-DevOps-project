apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-container
          image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-backend:3a500c0e9fa523db108d158dd5772b6144bec355
          ports:
            - containerPort: 5000
