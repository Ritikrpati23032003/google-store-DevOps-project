apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-container
          image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-backend:628dfb4a8fe3891d1e4ac9b2b5b66458649213ac
          ports:
            - containerPort: 5000
