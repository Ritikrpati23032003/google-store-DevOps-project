apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-container
          image: 992382498205.dkr.ecr.us-east-1.amazonaws.com/shopping-site-backend:1dca3b6fd9bb27163fa79734a213658c1f756b3b
          ports:
            - containerPort: 5000
